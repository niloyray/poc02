<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breakout</title>
    <link rel="stylesheet" href="../css/site.css" />
    <style>
      #game {
        display: block;
        width: 100%;
        max-width: 480px;
        height: auto;
        aspect-ratio: 3 / 4;
        touch-action: none;
        background: #101828;
        border: 1px solid #667;
        margin: 1rem 0;
      }
      #restart[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Breakout</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <canvas
      id="game"
      width="480"
      height="640"
      aria-label="Breakout play area. Move the paddle with the mouse, arrow keys or touch; press space or tap to launch the ball."
    ></canvas>
    <p>
      <button type="button" id="pause">Pause</button>
      <button type="button" id="restart" hidden>Restart</button>
    </p>
    <noscript><p>This game needs JavaScript.</p></noscript>
    <p><a href="../">Back to the hub</a></p>
    <script type="module" src="game.js"></script>
  </body>
</html>
