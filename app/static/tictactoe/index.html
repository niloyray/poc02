<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="../css/site.css" />
    <style>
      #board {
        display: grid;
        grid-template-columns: repeat(3, 5rem);
        gap: 0.5rem;
        margin: 1rem 0;
      }
      .cell {
        width: 5rem;
        height: 5rem;
        font-size: 2rem;
        font-weight: bold;
        cursor: pointer;
      }
      .cell.win {
        background: #ffd54a;
        color: #000;
      }
    </style>
  </head>
  <body>
    <h1>Tic-tac-toe</h1>
    <p>
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="two">Two players</option>
        <option value="easy">Computer (easy)</option>
        <option value="hard">Computer (hard)</option>
      </select>
    </p>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="board"></div>
    <p>
      <button type="button" id="restart">Restart</button>
      <button type="button" id="reset-tally">Reset tally</button>
    </p>
    <p id="tally"></p>
    <noscript><p>This game needs JavaScript.</p></noscript>
    <p><a href="../">Back to the hub</a></p>
    <script type="module" src="ui.js"></script>
  </body>
</html>
