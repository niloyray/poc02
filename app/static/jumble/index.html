<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word jumble</title>
    <link rel="stylesheet" href="../css/site.css" />
    <style>
      #tiles {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        max-width: 100%;
        margin: 1rem 0;
      }
      .tile {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        border: 2px solid currentColor;
        border-radius: 0.4rem;
        font-family: monospace;
        font-size: 1.5rem;
        font-weight: bold;
      }
      #answer {
        max-width: 100%;
        min-height: 44px;
        font-size: 1rem;
      }
      #answer-form button,
      #controls button {
        min-height: 44px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Word jumble</h1>
    <div id="tiles" aria-hidden="true"></div>
    <p id="letters"></p>
    <form id="answer-form" autocomplete="off">
      <label for="answer">Your answer</label>
      <input
        id="answer"
        type="text"
        maxlength="7"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
      />
      <button type="submit" id="submit">Submit</button>
    </form>
    <p id="tries-left"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="controls">
      <button type="button" id="shuffle">Shuffle</button>
      <button type="button" id="next-word">Next word</button>
      <button type="button" id="reset-tally">Reset tally</button>
    </p>
    <p id="tally"></p>
    <noscript><p>This game needs JavaScript.</p></noscript>
    <p><a href="../">Back to the hub</a></p>
    <script type="module" src="ui.js"></script>
  </body>
</html>
